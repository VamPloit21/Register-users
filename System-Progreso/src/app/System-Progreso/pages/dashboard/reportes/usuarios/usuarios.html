<h2>Listado de Usuarios (Consumo de API)</h2>

<!-- Mensaje mientras carga -->
<p *ngIf="cargando">Cargando información desde la API...</p>

<!-- Mensaje si hay error -->
<p *ngIf="errorCarga" style="color: red; font-weight: bold;">{{ errorCarga }}</p>

<!-- Tarjetas de usuarios -->
<div class="lista-cards" *ngIf="!cargando && usuarios.length > 0">
  <div class="card-usuario" *ngFor="let user of usuarios">
    <h3>{{ user.name }}</h3>
    <p class="username">@{{ user.username }}</p>
    <hr>
    <p><strong>Correo:</strong> {{ user.email }}</p>
    <p><strong>Teléfono:</strong> {{ user.phone }}</p>
    <p><strong>Ciudad:</strong> {{ user.address?.city }}</p>
    <p><strong>Empresa:</strong> {{ user.company?.name }}</p>
  </div>
</div>
