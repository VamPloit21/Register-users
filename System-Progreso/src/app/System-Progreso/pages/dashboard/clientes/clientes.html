<h2>Métricas de Clientes</h2>

<div class="stats-container">
  <div class="stat-card">
    <h3>Total de Clientes</h3>
    <p class="valor">{{ totalClientes }} clientes</p>
  </div>

  <div class="stat-card destacado">
    <h3>Nuevos Clientes</h3>
    <p class="valor">{{ nuevosClientes }} nuevos</p>
  </div>

  <div class="stat-card">
    <h3>Clientes Activos</h3>
    <p class="valor">{{ clientesActivos }} activos</p>
  </div>
</div>
