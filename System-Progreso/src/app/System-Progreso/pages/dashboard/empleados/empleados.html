<h2>Métricas de Empleados</h2>

<div class="stats-container">
  <div class="stat-card">
    <h3>Total de Empleados</h3>
    <p class="valor">{{ totalEmpleados }} empleados</p>
  </div>

  <div class="stat-card destacado">
    <h3>Empleados Activos</h3>
    <p class="valor">{{ empleadosActivos }} en turno</p>
  </div>

  <div class="stat-card alerta">
    <h3>En Vacaciones / Licencia</h3>
    <p class="valor">{{ enVacaciones }} ausentes</p>
  </div>
</div>
